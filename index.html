        { id: 13, year: "2023", title: "Sa Patnubay ng Espesyal at Dakilang Guro: The Stories of Unwavering Motivation of Filipino SpEd Teachers", author: "Fabrigar, Christ Anne A.; Basco, Angela Marie A.; Ferias, Crizzel Angela F.; Reate, Ralph Wendell C.; Rivas, Ruth Nicole V.; Salvador, Lira Joyce B.; Siga, Daryl M.", methodology: "Narrative", tags: ["Special Education teachers", "motivation to teach", "motivation to continue teaching", "students with special needs", "narratives", "purpose"], abstract: "Special Education (SpEd) has been one of the critical transglobal crusades for advocates of inclusivity and hope for children with disabilities and special needs. Diving into the depths of it, to be an advocate for the rights of children to education, seemed purposeful, but to be able to do it frontline for exceptional children that requires rigorous and intensive unique approaches is an entirely different story.\n \nHence, the purpose of this study lies in understanding what motivates teachers to choose and enter Special Education and continue teaching students with disabilities even after years of intensive instruction. With the limited literature pertaining to the teaching motivation of SpEd teachers alone, including studies available in the Philippines, the present narrative study aimed to understand and describe the experiences, motivations, and realizations of Filipino SpEd teachers through their rich and thick stories. Individual face-to-face, semi-structured, and three (3) sessions of interviews were utilized with ten (10) female SpEd teachers from different academic institutions in Metro Manila, provided that they fit the criteria set on the Pre-Qualification Form (PQF). Through the use of thematic analysis, the study generated seven (7) principal themes, namely, (1) Sense of Solicitude, (2) Passion beyond Teaching, (3) Emotionally Rewarding Profession, (4) Challenging yet Fulfilling, (5) Invaluable Support, (6) Acceptance of a Calling, and (7) Lasting Relationship. Each theme provided an understanding of the unique teaching experiences, motivations, and realizations of SpEd teachers, with fourteen (14) sub- themes. \n\nUltimately, this study aimed to advocate for the promotion of Special Education as a career and foundation of workshops and seminars that tackled the importance of the field, as well as spread awareness and debunk myths, misconceptions, and terms used towards children with special needs, most especially in the hoods of Psychology. \n", reservations: [] },
        { id: 14, year: "2023", title: "SCHOOL BURNOUT, PERCEIVED STRESS LEVELS, AND ONLINE DISINHIBITION AMONG CAS STUDENTS OF UE-MANILA", author: "Daza, Zarvie M.; De Los Reyes, Pia Elizabeth M.", methodology: "Correlational", tags: ["Burnout", "Perceived Stress", "Online Disinhibition"], abstract: "\nThe COVID-19 pandemic has caused a major shift that was evident with the innovation of telecommunication and maximizing the available resources to still manage to do things regardless of the limitations and restrictions. The surge of internet engagement led people to spend more time in the cyber community, resulting in active engagement with various social media platforms as it is the only way to cope with social interaction restrictions. This study employed a descriptive correlational method, purposive and convenience sampling technique for one hundred fifty-one (151) students, from 1st year to 4th year College of Arts and Sciences students at the University of the East - Manila. The result showed that the burnout establish no significant difference to the demographic; age (p = 0.524<=1.33), sex (p = 0.34<=9.49), socioeconomic status (p = 0.54<=15.51), year level (p = 0.20<=21.03), parental status (p = 0.94<=15.51); perceived stress to the demographic age (p = 0.65<=23.69), sex (p= 0.82<=5.99), socioeconomic status (p= 0.16<=9.49), year level (p = 0.22<=12.59), parental status (p = 0.16<=9.49); and online disinhibition (p = 0.13<=21.03), parental status (p = 0.39<=9.49). Only burnout and perceived stress had a positive correlation, while online disinhibition findings show no correlation. \n", reservations: [] },
        { id: 15, year: "2023", title: "SOCIAL ISOLATION AND SELF-ESTEEM AMONG COLLEGE STUDENTS OF THE UNIVERSITY OF THE EAST-MANILA", author: "Forca, Clarissa Jane F.; Mungcal, Meriam D.", methodology: "Correlational", tags: ["Social Isolation", "Self-esteem", "College students"], abstract: "\nSince the coronavirus disease 2019 (COVID-19) outbreak in December 2019, a large amount of data has been generated. COVID-19 has been declared a global pandemic by the World Health Organization (WHO) necessitating a global response to halt and reduce its spread.\n\nThe study aimed to determine the correlation of social isolation and the self-esteem among College Students of University of the East in Manila City. According to D. W. Russell (1996), social isolation can be classified into two categories, namely: positive non-lonely and negative lonely. The University of categories, California, Los Angeles Loneliness Scale Version 3 was used to measure the social isolation of the participants. Moreover, according to Rosenberg (1986), self-esteem can be classified as either \"positive self-esteem\" or \"negative self-esteem.\" The instrument used to measure the participants' self-esteem is the Rosenberg Self-Esteem Scale. According to the findings, there is a significant negative, weak correlation of social isolation and the self-esteem of the College Students of University of the East during the COVID-19 pandemic.\n\nThe findings of this study suggest that there is still a need for an interpersonal activities intervention plan to alleviate feelings of social isolation and improve self-esteem. Regardless of the weak correlation in the results, a proposed interpersonal activities intervention plan was prepared for future researchers, and they may use this research for whatever purpose they see fit.\n", reservations: [] },
        { id: 16, year: "2023", title: "Psycing the Psych: A Case Study on a Practicing Psychologist Previously Diagnosed with Bipolar and Borderline Personality Disorder", author: "Alisbo, Earl John C.; Capellan, Charmaine L.; Garcia, Hannah Mae G.; Losañez, Rianna Alona Marie P.; San Gabriel, Marvin D.", methodology: "Case Study", tags: ["Practicing psychologist", "mental illness", "stigma", "bipolar disorder", "borderline personality disorder"], abstract: "The present study delves deeply into the intricate and multifaceted lived experiences of a psychologist actively engaged in the field, having to live with the dual diagnosis of bipolar disorder and borderline personality disorder. This study adopts a systematic framework to explore the nuanced intersection of the psychologist's personal mental health challenges and their professional identity. Through in-depth interviews, thematic analysis, and reflexivity, we elucidate the unique challenges, coping mechanisms, and transformative aspects of the psychologist's journey. By shedding light on the complexity of reciprocation between mental health and the therapeutic process, this study contributes to a more profound understanding of the difficulties faced by mental health professionals. Thus, the findings hold implications for destigmatizing mental health struggles within the psychological community and advocate for enhanced support systems for practitioners managing similar dual diagnosis.", reservations: [] },
        { id: 17, year: "2023", title: "ACADEMIC SELF-EFFICACY PROFILE OF SELECTED SENIOR HIGH SCHOOL STUDENTS FROM UNIVERSITY OF THE EAST, MANILA", author: "Agliam, Patricia M.; Cruz, Hannah Grace D.; Funes, Franz Eunice C.; Hernal, Arianne Lucille F.; Ledesma, Aurora Ysabel Z.; Perey, Rica Marie L.", methodology: "Descriptive", tags: ["Academic Self-efficacy", "Senior high school", "Gender", "Strand"], abstract: "Academic self-efficacy is the term used to describe students' attitudes and beliefs about their abilities to succeed academically, as well as their confidence in their capacity to complete academic assignments and successfully learn the subject. There has been a countless body of research aimed at studying the self-efficacy of college students but none particularly targeted to senior high school which is the transitioning years to college. In order to address this gap in knowledge, the researchers conducted a study which aims to profile and assess the level of academic self-efficacy of selected senior high school students at the University of the East-Manila. 277 respondents from different academic strands in grade 11 and grade 12 were randomly selected to answer a 5-point likert scale survey questionnaire that assesses their levels of academic self-efficacy. The researchers utilized a quantitative approach, specifically a descriptive research design, in order to determine the level of the students' self-efficacy and whether there is a significant difference with their academic self-efficacy when grouped according to gender and academic strand. Using the Mann-Whitney U self-efficacy test, it was found that there is a significant difference in the academic self-efficacy of students when grouped according to gender and academic strands. Moreover, it was found that across all strands, a higher percentage of the students have a low level of efficacy (86.64%), whereas in terms of gender, majority of the female respondents have low levels of academic self-efficacy (82.91%). With these findings, we have made some recommendations in order to improve students’ self-efficacy.", reservations: [] },
        { id: 18, year: "2023", title: "YAMANG IPINAGKAIT: EXPLORING INTERGENERATIONAL TRANSMISSION OF POVERTY AMONG STREET DWELLERS", author: "Aguilar, Jose Miguel B.; Alvaran, Janna Adriana D.C; Angellano III, Severino C.; Basilio, Angelyn L.; Martinez, Ronisa Francine S.; Miciano, Alyssa Faye S.; Resuena, Judith Isabelle V.", methodology: "Exploratory", tags: ["Poverty", "Street Dwellers"], abstract: "", reservations: [] },
        { id: 1, year: "2022", title: "Beneath the Beauty: A Feminine Struggle of Attaining Body Positivity Among Young Women", author: "Crescini, Paulene S.; Gat-Eb, Noel Simonjohn E.; Patawaran, Jester E.; Paza, Aila Marie L.; Sabangan, Donna Claire P.; Salazar, Ysabel Mikaela H.; Somollo, Gwyneth S.", methodology: "Phenomenological", tags: ["Body Positivity", "Body Shaming", "Body Image", "Struggles", "Young Filipino Women", "Phenomenological Study"], abstract: "People's perceptions of themselves and their bodies are exposed to societal influence. Body positivity is a growing trend that encourages people to express positive feelings about their bodies. This trend focuses on accepting and embracing one’s flaws as a source of strength rather than a source of shame, thus rejecting current ideals of beauty. Body positivity is prevalent in today's generation. Behind body positivity, every person, specifically women, has their own struggles after accepting and loving their own body. To address this problem, the purpose of this study was to understand the experiences of young Filipino women, their struggles in attaining body positivity, and how they overcame these experiences. The data was gathered through interviews with young Filipino women between 18 to 25 years old. It was conducted by using the audio and video-conferencing application Google Meet. The resulting themes generated through data analysis, which was conducted using Interpretative Phenomenological Analysis (IPA), revealed five (5) emergent themes, which are as follows: Self-love, Improvement of Overall Well-being, Ways of Loving Oneself, Aspiration, and Struggles. Upon assessing the findings, it was concluded that there is an existent phenomenon where young Filipino women experience the act of wanting to attain body positivity and experience various struggles whilst doing so.", reservations: [] },
        { id: 2, year: "2022", title: "Embodying Womanhood: Lived Experience of Transpinays who have had Gender Affirmation Surgery", author: "Cuizon, Wyncyr R.; Gapusan, Lyra Jeatrice D.; Gonzalez, Marian Grace M.; Guileb, Kathleen Vince T.; Juayong, Catherine Kier R.; Palomo, Alyssa Jane S.; Payawal, Gabrielle Louisse B.", methodology: "Phenomenological", tags: ["Transpinays", "gender affirmation surgery", "gender incongruence", "womanhood", "Interpretative Phenomenological Analysis (IPA)"], abstract: "This phenomenological study investigated the lived experiences of transpinays who have had gender affirmation surgery (GAS) toward embodying womanhood. The challenges, perceived understanding, and realizations of seven (7) transpinays, ages twenty-five (25) to fifty-five (55), were explored in a series of forty (40) to sixty (60) minute in-depth interviews guided correspondingly by the researchers' validated aide memoire. All data obtained from the participants were transcribed, coded, and analyzed using Interpretative Phenomenological Analysis (IPA). Research results yielded seven (7) main themes: Psychological Discordance, Financial Constraints, Surgical Repercussions, Self-determination, Self-acceptance, Gender Independence, and Gender Congruence. This phenomenological conspectus was further depicted in the \"Embodiment of Womanhood,\" exemplifying the emblematic translation of the participants' growth as they gradually embrace themselves as women. The findings shall provide knowledge and awareness of the participant's understanding, which may help procure causes that will aid the transpinays' overall welfare.", reservations: [] },
        { id: 3, year: "2022", title: "Embracing the Unknown Future: Exploring the Career Anxiety of Graduating Dentistry Students During COVID-19 Pandemic", author: "Baranda, Angela P.; Ostraes, Justine P.; Padilla, Elaine Bianca L.; Parin, Jana Cloydine M.; Sinoy, Paul Brian C.; Tabuena, Mica Ella D.; Vergara, Angelica Kristine S.", methodology: "Phenomenological", tags: ["Career anxiety", "graduating dentistry students", "career uncertainty", "career regrets", "career development"], abstract: "Adulthood means making adjustments, adaptations, and taking on new responsibilities, such as transitioning from school to the workplace. Although these sudden changes are normally experienced by people, they can cause anxiety about establishing a future career, hence called career anxiety. Career anxiety is defined as the pressure, stress, and uncertainty experienced by individuals with regard to their career path. With the presence of the pandemic, this phenomenon was found to be more prevalent. Given the risks and vulnerability of the dental profession to COVID-19, this qualitative study investigates the career anxiety of graduating dentistry students during the pandemic. The aim of the study is to learn about the general experiences, the factors that contribute to career anxiety, its impact on their lives, and their coping strategies. The present study utilized purposive sampling, focusing on eight (8) graduating dentistry students. Semi- structured interviews were conducted to explore their experiences of career anxiety during the pandemic. By utilizing thematic analysis, six major themes emerged: negative functioning, challenges in career acquisition, inevitable career detour, school-life imbalance, adaptive coping, and healthy support system. These findings provided insight into the unique experiences and perspectives of graduating dentistry students, providing potential approaches to help ease their anxiety and support these students in their careers.", reservations: [] },
        { id: 4, year: "2022", title: "Kaka-ML mo yan: Users' Online Game Engagement and their Psychological Well-being", author: "Dela Cruz, Jeric; Ocoma, Leigh Mary; Pacpaco, Romelen; Samson, Rica-Meg; Tobes, Erica Joy; Varela, Mheera Jhoi; Vargas, Mary Mel", methodology: "Phenomenological", tags: ["Mobile game", "Online game engagement", "psychological well-being"], abstract: "The purpose of this study is to understand and analyze the lived experiences of online gamers during the pandemic. It aimed to answer the questions (1) What is the participants' engagement in Mobile Legends, and how do they describe their experiences? (2) What are the participants' in-game experiences? What are the factors that contribute to their psychological well-being? (3) What issues did the participants encounter? (4) What realizations can be derived from the online gaming experiences of the participants? Using a phenomenological approach, this study investigated the online gaming engagement of nine (9) college students aged 18-22 who play Mobile Legends: Bang Bang for at least eight (8) hours. To gather data, a validated aide-mémoire was used as the main instrument for gathering data which consists of twenty-seven open- ended questions. Based on the qualitative analysis, there were eight (8) master themes that emerged to answer the purpose of the study, mainly Socially Motivated, Building of Companionship, Flexibility, Emotional Outcomes of Playing, Cognition, Motivation, Challenges, and Realization. These interpret the engagement and experiences of college students regarding their long time spent playing Mobile Legends.", reservations: [] },
        { id: 5, year: "2022", title: "Never Good Enough: Lived Experiences of Perceived Academically Excellent Students with Imposter Phenomenon", author: "Cabela, Maria Gillianne R.; Cunanan, Grace Dominique D.; Danaytan, Jeaneire Mae B.; Garcia, Stephanie Vien L.; Lim, Mica Angela M.; Manzano, Jamima D.; Tayamen, Rica Angela A.", methodology: "Phenomenological", tags: ["Impostor Phenomenon", "perceived academically excellent students", "phenomenological study", "thematic analysis", "Manila", "academic performance", "mental well-being"], abstract: "The Impostor Phenomenon has only recently come to the public's attention. With the limited literature regarding Impostor Phenomenon, including studies available in the Philippines, the present phenomenological study aims to explore the Impostor Phenomenon among perceived academically excellent students and how they experience it by narrating their lived experiences One-on-one semi-structured interviews were utilized in an online platform across eight (8) students from different universities in Manila City, Philippines, provided that they scored sixty-one (61) and above on the Clance Impostor Phenomenon Scale. Following that, through the use of thematic analysis six (6) themes appeared: Omnipresence of the Impostor Phenomenon, Adverse Manifestations, Heavy Academic Burden, Challenges to Mental Well-Being, Success as Fraudulence, and Existing Coping Strategies. Each theme represents the lived experiences of the students living with Impostor Phenomenon. Given that the research is limited in its extent, this research recommends further study that will aid in a deeper understanding of the phenomenon and possible interventions", reservations: [] },
        { id: 6, year: "2022", title: "New Role Unlocked: Exploering the Lived Experiences of Young Adult Single Fathers", author: "Abalos, Camilla Ray A.; Almonte, Piolo S.; Fontanilla, Chriza Khim L.; Hamor, Shaira Mae B.; Marcos, Jackielyn J.; Roman, Chloe Q.; Salud, Maria Nina Angelica J.", methodology: "Phenomenological", tags: ["Fatherhood", "young adult single father", "young fatherhood", "early parenthood"], abstract: "Lone parenting has always been credited to women, which often overlooks the struggles of single fathers. However, being a single father at a young age adds a new level of difficulty. In light of this, the primary purpose of this phenomenological study is to uncover the concerns, perceptions, and realizations of young adult single Filipino fathers. The current study consists of six (6) employed young adult single fathers who have experienced early fatherhood at ages 16-19 and have been single parents for at least three years. The gathered data from the participants was analyzed using the Interpretative Phenomenological Analysis (IPA). The findings identified eight (8) emergent master themes: Demands of Early Fatherhood, Challenges of Early Fatherhood, Sense of Maturity, Sense of Selflessness, Authoritative Parenting Style, Fundamental Characteristics, Sense of Familiarization, and Influence of Sexual Illiteracy in Early Fatherhood. These revealed that young adult single fathers experience a great deal of sacrifices and challenges as a result of being the only sole provider and caregiver of their child/ren. Despite these, their situation has also brought positive changes in their lives. Out of love and concern for their children, these young adult single fathers adopted positive traits and healthy ways of parenting and lifestyle. Ultimately, they gained new perspectives and learned from their experiences.", reservations: [] },
        { id: 7, year: "2022", title: "Pressure to do Well: Understanding the Essence of Scholarship Among Students in UE Manila", author: "Bernis, Erni Hannah C.; Malata, John Lowell G.; Mirando, Jessy Addrienne C.; Pag-ilion, Reinabelle Kim F.; Tan, Shayne Jillian A.", methodology: "Phenomenological", tags: ["Academic pressure", "College students", "Coping strategies", "Phenomenology", "Scholarship"], abstract: "Scholars in fourth year college have numerous academic challenges to deal with. Through this, fourth year college students are identified as vulnerable to academic pressure. These students frequently struggled to strike a balance between the demands of their academic and personal lives. Using interpretative Phenomenological Analysis (PA), our study aimed to better understand and analyze the essence of the scholarship among students in University of the East-Manila. The central question that this qualitative research study sought to answer: What are the lived experiences of students in experiencing academic pressure? A total of 8 participants from different courses under the Department of Behavioral Sciences: College of Arts and Science (CAS) were purposely selected to participate in our study. This qualitative research study focused on the lived experiences of fourth year scholars who attained a University Presidential Scholarship for three (3) to four (4) consecutive semesters. Data was collected through an online in-depth interview via Google Meet application. The results of the study revealed that scholars are facing High Expectations, Academic Burnout, Emotional Adjustment, and Academic Motivation. This study recommends that faculty members must give appropriate and reasonable numbers of workloads that are realistically attainable by the students without compromising their academic well-being. ", reservations: [] },
        { id: 8, year: "2022", title: "The Untold Episode: Unveiling the Experiences of First-time Mothers with Peripartum Depression", author: "Gammad, Dezcy V.; Morla, Diane Mikaela A.; Quiazon, Elaisa May L.; Soriano, Micah Joanne E.; Torregrosa, Moana Marie D.", methodology: "Phenomenological", tags: ["Qualitative", "phenomenological", "first-time mother", "peripartum depression", "IPA"], abstract: "This qualitative study unveiled the lived experiences of first-time mothers with peripartum depression. The phenomenological research design was applied to focus on the participants' shared experiences as they encountered this phenomenon. This study explored the participants' expectations of motherhood, thoughts, feelings, challenges, and collective discernments about peripartum depression. The researchers garnered eight (8) first-time mothers who willingly consigned their consent to disclose their experiences in an in-depth interview composed of three (3) sessions using an online platform called Google Meet. Upon formulating the findings, the Interpretative Phenomenological Analysis was used in analyzing and interpreting the data gathered from the participants. With the utilization of this strategy, five (5) major themes emerged: Skepticism, Anxiety, Motherhood Dissatisfaction, Resiliency, and Collective Wisdom. Under these major themes are ten (10) subthemes that would expound the meanings of the participants' knowledge. The findings presented that participants could adapt their experiences as first-time mothers as they transitioned to motherhood. Furthermore, peripartum depression has been detrimental to their overall well-being as it impacts their perception of themselves and their interpersonal relationship. In conclusion, participants achieved a sense of fulfilment towards parenting their babies despite their challenges and struggles as first-time mothers. For recommendations, future researchers can expand their approach, the number of participants, and age range to improve the findings of the recent study. ", reservations: [] },
        { id: 9, year: "2022", title: "To Be or Not to Be Single: A Phenomenological Understanding of Filipino Men and Women's Singlehood", author: "Aguirre, Fina Danese B.; Caliso, Reus M.; Duloguin, Xyra Juver M.; Francisco, Lara Jane D.; Mislang, Rona Mae S.; Paras, Kristine Olceen R.; Rafael, Jewel Ann M.", methodology: "Phenomenological", tags: ["Singlehood", "lived experiences", "Filipino men and women", "single blessedness", "purposive sampling", "semi-structured interview"], abstract: "Singlehood is the state of being unmarried or not having any romantic relationship. The research aims to understand Filipino men and women's lived experiences and why they are single. Purposive sampling was utilized to gather participants. The focus would be the lived experiences of all types of singles as long as they have never been married who are currently single for at least five years now, who are thirty years old and above. However, there are no participants in the study that fall under single blessed, with that the study does not further discuss single blessedness. Semi-structured interviews were utilized, the data were transcribed and analyzed, and results revealed recurring themes: (a) The Adverse Emotional Trauma Experiences, (b) Positive Outlook, (c) Societal impact, (d) Beneficial Impact, (e) Self-care coping, which concludes that singlehood among men and women has both advantages and disadvantages as they experienced challenges and beneficial impacts of their singlehood. This study contributes to the scarcity of literature about the self-perception of single men and women. Moreover, participants, future researchers, single individuals, and society can men and expand their knowledge and awareness about the phenomenon of singlehood, non-married individuals. ", reservations: [] },
        { id: 10, year: "2022", title: "Behind the Screens: Exploring the Impact of Cyberbullying among College Students", author: "Cruz, Ma. Erika C.; Embodo, Ma. Trisha A.; Escaño, Mary Joyce T.; Gimena, Jhoanna Marie E.; Lacap, Bettynie Windys V.; Maceda, Danielle U.; Requilme, Justine C.", methodology: "Narrative", tags: ["Cyberbullying", "behind the screens", "internet", "lived experiences", "coping strategies"], abstract: "The emergence of cyberbullying has become a topic of interest for parents, scholars, universities, and the Philippine government due to the increased amount of internet consumption. This study explored how students overcome cyberbullying, especially at the tertiary level as most of the local studies found by the researchers were more concerned with the lower levels of education. A total of five (5) participants went through semi-structured interviews and were done four (4) to five (5) times to be able to saturate the data. The data gathered generated four (4) themes. The researchers concluded that cyberbullying had impacts on the college students as they undergone (1) Traumatic experiences that created (2) Complex changes in their point of view despite the utilization of their (3) Internal and External Resources which finally prompt them to (4) Response. The present study has contributed to the body of knowledge that seeks to know whether the potential personal growth experienced by foreign people may also apply to our compatriots in the Philippines. It can also help the victims of cyberbullying to cope, the people to recognize cyberbullying, and understand its emotional impact on the victims and its importance of preventing it.", reservations: [] },
        { id: 11, year: "2022", title: "Filling the Empty Hole: Journey Towards Self-Acceptance of Adopted Filipino Students", author: "Gregorio, Eloiza F.; Paraiso, Tricia; Bacordo, Chrisreign Rose T.; Esogon, Jacqueline Ann T.; Cabalud, Kyla Jane D.; Cadileña, Alejandria Novelle G.; Aquino, Dianne Claire", methodology: "Narrative", tags: ["Adoption", "Self-Acceptance", "Adoption Disclosure", "Narrative Study", "Foster Care", "Orphanage"], abstract: "Adoption is defined as the emotional, social, and legal process in which children will not be raised by both of their biological parents. These children will be fully absorbed into another family and become permanent members of that family. When it comes to the self-acceptance journey of adopted children, there are only a few studies across the world that focus on their journey to self-acceptance, and have been published, and can be used as reference. The purpose of this narrative study was to explore the journey toward self- acceptance of adopted individuals when their adoption was disclosed to them. Purposive sampling was used to gather participants. The focus of this study was on the journey of six people who were legally adopted no later than 18 months after birth: adoption disclosure occurred between the ages of 6 and 12; and are now between the ages of 18 and 25. Semi-structured interviews were utilized together with video and audio recordings. The interviews were transcribed and analyzed, The results revealed recurring themes: (a) Provided Sustenance, Familial Affection, and Intrapersonal Sentiments, (b) Unstirred and Acrimony, (c) Identity Predicaments, Positive Relations, and Efficacious Personal Outcomes, and (d) Emotional Fulfillment, Growth Mindset, and Self Confidence. This study will not only contribute to the psychological and sociological fields of research, but it will also provide qualitative data in the study adoption and self-acceptance. Moreover, this study also focuses on adoption disclosure that came from adoptive parents themselves rather than adopted individuals discovering it on their own, this study could also be relevant in such a way that they can assess how best to reveal the adoption, what to expect, and when it is best to disclose it.", reservations: [] },
        { id: 12, year: "2022", title: "Harnessing Climate Change Anxiety: the Untold Stories Behind Filipino Youth's Climate Action", author: "Bedania, John Paul D.; Cacatian, Jaume R.; Cruz, Marteen Kristian R.; Ducay, Chrisha Mae P.; Perez, Bless M.; Ricaro, Ria Lizzete C.", methodology: "Narrative", tags: ["Climate change", "climate change anxiety", "climate action", "mental health", "well-being"], abstract: "One of the catastrophic problems of the 21st century includes climate change. Given its leveling impacts, it has placed the youth at the forefront of climate action following their experience of climate change anxiety characterized as the frustration and fear stemming from one's awareness of increasing life threats from climate change (Reyes et al., 2021 Currently, only a few studies conducted in the Philippines have investigated and proved the existence of climate change anxiety and its association with climate action, mental health, and well-being. Hence, the present study aims to discover the story behind the climate action of Filipino youth who are experiencing climate change anxiety, their motivation in pursuing climate action, their perception of their mental health and well-being, and coping strategies in experiencing climate change anxiety. One-on-one semi-structured interviews were conducted with ten (10) youth climate advocates from an environmental conservation organization in Metro Manila, Philippines. This narrative qualitative study used thematic analysis to reveal a sufficient understanding that climate change anxiety catalyzes climate action in youth and ascertains their mental health and well-being concerns. Also, the study suggests the importance of cultivating the youth's sense of agency in their formative stage of life, and the necessity of creating an effective climate change teaching plan and policy to guard the Filipino youth's mental health and well-being in engaging in climate action while experiencing climate change anxiety.", reservations: [] },
        { id: 13, year: "2022", title: "Life After Addiction: Journey of People with Past Alcoholism Towards Self-Forgiveness", author: "Almandres, Janine Egana; Chavez, Mike Johnry B.; Cosino, Hysiel L.; Isidro, Deirdre James G.; Ortega, Gerice T.; Soza, Edna Richelle S.; Tolentino, Jodi Kaye", methodology: "Narrative", tags: ["Alcoholism", "self-forgiveness", "sober", "relapse", "narrative"], abstract: "Drinking has become part of traditions, culture, and different types of celebrations, while others utilize it as a pleasant way of relaxation. While many people can drink a reasonable quantity of alcohol without harm, for others, even one drink might set them on a disastrous journey. This study looked into how people with alcoholism recovered and attained self-forgiveness. The study concentrated on the journey of people with past alcoholism, which follows the criteria of the PQF the researchers have provided, and were sober for at least three (3) months, toward self-forgiveness but it is not limited to self-forgiveness itself. This includes people who have stopped drinking and those who still don't forgive themselves. The researchers gathered twelve (12) participants using purposive sampling and used a narrative interview with open-ended questions about participants' experiences with past alcoholism and their journey toward self-forgiveness. The findings of the study were divided into five sections that conveyed the various perspectives of the journey of people with past alcoholism towards self-forgiveness, namely, 1) the alcoholism experience of people with past alcoholism; 2) factors that contributed to the change of people with past alcoholism; 3) recovery process of people with past alcoholism; 4) achieving self-forgiveness in individuals with past alcoholism; and 5) the life after their alcohol addiction. Each area was further subdivided into themes and subthemes based on the participants' responses.", reservations: [] },
        { id: 14, year: "2022", title: "Lived Experiences of College Students who are Body Shamed Through Social Media", author: "Ayento, Her Jae Abad; Baasis, Bea Christel Abesamis; Balacoa, Charlene Masola; Catapang, Bernadette; Hao, Daryll Rian Gutierrez; Mendoza, Czarhina Gwenn Corpuz; Sanglay, Erin Ashley Casem", methodology: "Narrative", tags: ["Body shaming", "bullying", "harassment", "standards", "well-being", "body acceptance"], abstract: "Body shaming is still prevalent globally, including in the Philippines. It is a form of bullying or harassment that primarily targets the physical attributes of a person’s body. Ideal body standards lead to huge factors that affect the well-being of other individuals who experience dissatisfaction with their bodies because of body shaming. The study aimed to determine the thoughts and feelings of college students who have experienced body shaming on social media with a narrative approach. The researchers explore the lived experiences of college students in overcoming the obstacles of body shaming with the hope of breaking the stigma. In a constructivist worldview, the research study took a qualitative approach. It used a purposeful sampling technique to select six (6) college students who are social media users who have experienced body shaming and completed the Pre-Qualification Form. This study yielded four (4) main themes: unpleasant, body dissatisfaction, eustress and distress, and improving oneself. The implications of this study are the following: is to promote body acceptance, which will reject the confined beauty standards and societal pressures in social media that interfere with individuals' overall well-being and to focus on familial units and how their body shaming comments have affected an individual's perception of their own body image as they grow up.", reservations: [] },
        { id: 15, year: "2022", title: "The Perceived Parenting Styles and Academic Performance Among College Students", author: "Beleno, Jhon Raymart; Gayo, Jean Dolly D.; Moran, Angelika Louisse M.; Tamayo, Clarence T.; Tatad, Amnel A.", methodology: "Correlational", tags: ["Parenting style", "Academic Performance", "College Students"], abstract: "The aim of this study is to know the influence parenting styles on the academic performance of college students in different universities inside Manila. This study also used a survey as a research design to collect data from eighty (80) college students and their eighty (80) parents living in Metro Manila to gather knowledge and insights about parenting styles and academic performance. The Chi-square test and an inference correlational design were used in this study to determine the relationship between parenting style and academic performance of college students. Based on the results of Chi-square test between parenting style and academic performance there is no significant association between parenting style and academic performance. In the Correlation Coefficient between GWA and average score of the three parenting styles, it also shows that there is no linear relationship between the academic performance and average score of the three parenting styles (refer to appendix G).", reservations: [] },
        { id: 16, year: "2022", title: "Towards Flourishing: Exploring The Impact of Practicing Gratitude on Well-being of UE Psychology Students", author: "Briola, Angel; Domingo, Lance Anjelic; Matias, Mylene; Samson, Angelo; Villanueva, Sheila Mae; Villegas, Nice; Ylagan, Karylle Angel", methodology: "Mixed Methods", tags: ["Gratitude", "Mixed Methods", "Positive Psychology", "Three good things", "Well-being"], abstract: "Despite an increase in the prevalence of mental illness among students, implementation of psychological interventions is lacking in the Philippines. Numerous research suggests that practicing gratitude can improve well-being yet there are mixed findings concerning their effectiveness. The purpose of this mixed methods experimental study was to investigate the impact of Three Good Things exercise on the well-being of college student samples. A total of 55 participants (aged 19-23) were randomly assigned to experimental (three good things) and control group (neutral events). The experiment lasted for two weeks. Participants completed a well-being measure which was collected at pre- and post-experiment. Findings revealed that the experimental group significantly scored higher in well-being relative to the control and that practicing gratitude significantly improved their well-being. Five themes emerged in the follow-up interview concerning their experience of the said exercise: (1) experience of positive emotions, (2) heightened enthusiasm in life, (3) improved relationships with others, (4), realization in life, and (5) striving for success. These findings have implications for optimizing a simple yet cost- effective psychological intervention to enhance well-being.", reservations: [] },

    let currentYear = "2025";
    let currentCategory = "All";
    let selectedBookId = null;

    // Initialization
    function init() {
        renderTabs();
        renderFilters();
        renderCatalog();
        populateAvailableDates(8); // Generates upcoming Mondays & Wednesdays for 8 weeks ahead
    }

    // Dynamic Monday and Wednesday Date Generator
    function populateAvailableDates(weeksAhead = 8) {
        const select = document.getElementById('reserveDate');
        select.innerHTML = '';
        
        const today = new Date();
        let count = 0;
        
        for (let i = 0; count < weeksAhead * 2; i++) {
            const d = new Date();
            d.setDate(today.getDate() + i);
            
            const dayOfWeek = d.getDay(); // 1 = Monday, 3 = Wednesday
            
            if (dayOfWeek === 1 || dayOfWeek === 3) {
                const isoDate = d.toISOString().split('T')[0];
                const formattedText = d.toLocaleDateString('en-US', {
                    weekday: 'long',
                    month: 'short',
                    day: 'numeric',
                    year: 'numeric'
                }).replace(',', ' -');

                const option = document.createElement('option');
                option.value = isoDate;
                option.textContent = formattedText;
                select.appendChild(option);
                
                count++;
            }
        }
    }

    function renderTabs() {
        const years = [...new Set(thesisDatabase.map(b => b.year))].sort().reverse();
        const container = document.getElementById('yearTabs');
        container.innerHTML = years.map(y => `
            <button class="tab-btn ${y === currentYear ? 'active' : ''}" onclick="setYear('${y}')">${y}</button>
        `).join('');
    }

    function renderFilters() {
        const categories = ["All", ...new Set(thesisDatabase.map(b => b.methodology))];
        const container = document.getElementById('catFilters');
        container.innerHTML = categories.map(c => `
            <button class="cat-btn ${c === currentCategory ? 'active' : ''}" onclick="setCategory('${c}')">${c}</button>
        `).join('');
    }

    function renderCatalog() {
        const query = document.getElementById('searchBar').value.toLowerCase();
        const container = document.getElementById('catalogList');
        
        const filtered = thesisDatabase.filter(book => {
            const matchesYear = book.year === currentYear;
            const matchesCat = currentCategory === "All" || book.methodology === currentCategory;
            const matchesSearch = book.title.toLowerCase().includes(query) || 
                                  book.abstract.toLowerCase().includes(query) ||
                                  book.tags.some(t => t.toLowerCase().includes(query));
            return matchesYear && matchesCat && matchesSearch;
        });

        if(filtered.length === 0) {
            container.innerHTML = '<p style="color: var(--text-muted); padding: 10px;">No matching theses found.</p>';
            return;
        }

        container.innerHTML = filtered.map(book => `
            <div class="book-card ${book.id === selectedBookId ? 'selected' : ''}" onclick="selectBook(${book.id})">
                <div class="book-title">${book.title}</div>
                <div class="book-meta">
                    <span>👤 ${book.author}</span>
                    <span>📂 ${book.methodology}</span>
                    <span>📅 ${book.year}</span>
                </div>
                <div style="display:flex; gap:5px; flex-wrap:wrap;">
                    ${book.tags.map(t => `<span class="tag">#${t}</span>`).join('')}
                </div>
            </div>
        `).join('');
    }

    function setYear(year) {
        currentYear = year;
        renderTabs();
        renderCatalog();
    }

    function setCategory(cat) {
        currentCategory = cat;
        renderFilters();
        renderCatalog();
    }

    function selectBook(id) {
        selectedBookId = id;
        renderCatalog();
        
        const book = thesisDatabase.find(b => b.id === id);
        document.getElementById('panelTitle').innerText = book.title;
        document.getElementById('panelAbstract').innerText = book.abstract;
        document.getElementById('panelContent').style.display = 'flex';
        
        updateReservationsList(book);
    }

    function updateReservationsList(book) {
        const container = document.getElementById('existingReservations');
        if(book.reservations.length === 0) {
            container.innerHTML = '<p style="color: var(--text-muted)">No active reservations. All dates open.</p>';
            return;
        }
        container.innerHTML = book.reservations.map(r => `
            <div class="res-item">
                <span class="res-date">🗓️ ${r.date}</span>
                <span>Claimed by: ${r.name}</span>
            </div>
        `).join('');
    }

    function makeReservation() {
        const name = document.getElementById('borrowerName').value.trim();
        const date = document.getElementById('reserveDate').value;
        
        if(!name) {
            alert('Please enter your name to book!');
            return;
        }

        const book = thesisDatabase.find(b => b.id === selectedBookId);
        
        const exists = book.reservations.some(r => r.date === date);
        if(exists) {
            alert('This specific book is already reserved for that date! Please select another open Monday or Wednesday.');
            return;
        }

        book.reservations.push({ date, name });
        alert(`Successfully reserved "${book.title}" for ${date}!`);
        document.getElementById('borrowerName').value = '';
        updateReservationsList(book);
    }

    document.getElementById('searchBar').addEventListener('input', renderCatalog);
    init();
</script>
