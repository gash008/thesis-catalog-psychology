<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thesis Book Reservation System</title>
    <style>
        :root {
            --bg-color: #121212;
            --surface-color: #1e1e1e;
            --primary-color: #bb86fc;
            --secondary-color: #03dac6;
            --text-color: #e0e0e0;
            --text-muted: #a0a0a0;
            --border-color: #333333;
            --reserved-color: #cf6679;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }

        @media (min-width: 900px) {
            .container {
                grid-template-columns: 2fr 1fr;
            }
        }

        header {
            grid-column: 1 / -1;
            background: var(--surface-color);
            padding: 20px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        h1 {
            color: var(--primary-color);
            font-size: 1.5rem;
        }

        .search-bar {
            background: #2d2d2d;
            border: 1px solid var(--border-color);
            padding: 10px 15px;
            border-radius: 20px;
            color: white;
            width: 100%;
            max-width: 400px;
            outline: none;
        }

        .tabs-container {
            background: var(--surface-color);
            border-radius: 8px;
            border: 1px solid var(--border-color);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .tabs {
            display: flex;
            gap: 10px;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 10px;
            overflow-x: auto;
        }

        .tab-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 8px 16px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1rem;
            white-space: nowrap;
        }

        .tab-btn.active {
            color: var(--primary-color);
            border-bottom: 2px solid var(--primary-color);
            margin-bottom: -12px;
        }

        .category-filters {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 5px;
        }

        .cat-btn {
            background: #2d2d2d;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 6px 12px;
            border-radius: 15px;
            font-size: 0.85rem;
            cursor: pointer;
        }

        .cat-btn.active {
            background: var(--primary-color);
            color: #121212;
            font-weight: bold;
        }

        .catalog-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-height: 600px;
            overflow-y: auto;
            padding-right: 5px;
        }

        .book-card {
            background: #252525;
            border-left: 4px solid var(--secondary-color);
            padding: 15px;
            border-radius: 4px;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
        }

        .book-card:hover {
            transform: translateX(3px);
            background: #2d2d2d;
        }

        .book-card.selected {
            background: #2d2d2d;
            border-left-color: var(--primary-color);
        }

        .book-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .book-meta {
            font-size: 0.85rem;
            color: var(--text-muted);
            display: flex;
            gap: 15px;
            margin-bottom: 8px;
            flex-wrap: wrap;
        }

        .tag {
            background: #333;
            color: var(--secondary-color);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.75rem;
        }

        .reservation-panel {
            background: var(--surface-color);
            border-radius: 8px;
            border: 1px solid var(--border-color);
            padding: 20px;
            height: fit-content;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .abstract-box {
            background: #252525;
            padding: 15px;
            border-radius: 6px;
            font-size: 0.9rem;
            line-height: 1.4;
            color: #ccc;
            max-height: 180px;
            overflow-y: auto;
            border: 1px solid #333;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        label {
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: bold;
        }

        input, select {
            background: #252525;
            border: 1px solid var(--border-color);
            padding: 10px;
            color: white;
            border-radius: 4px;
            outline: none;
        }

        .reserve-btn {
            background: var(--primary-color);
            color: #121212;
            border: none;
            padding: 12px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1rem;
            transition: background 0.2s;
        }

        .reserve-btn:hover {
            background: #a370db;
        }

        .reservations-view {
            margin-top: 10px;
            font-size: 0.85rem;
        }

        .res-item {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            border-bottom: 1px solid #333;
        }

        .res-date {
            color: var(--secondary-color);
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>📚 Thesis Catalog & Book Reservation</h1>
        <input type="text" id="searchBar" class="search-bar" placeholder="Search title, keywords (e.g. body shaming)...">
    </header>

    <main class="tabs-container">
        <div class="tabs" id="yearTabs">
            <!-- Dynamic Year Tabs -->
        </div>
        
        <div class="category-filters" id="catFilters">
            <!-- Dynamic Methodologies -->
        </div>

        <div class="catalog-list" id="catalogList">
            <!-- Dynamic Book Cards -->
        </div>
    </main>

    <aside class="reservation-panel" id="resPanel">
        <h3 id="panelTitle">Select a book to reserve</h3>
        
        <div id="panelContent" style="display: none; flex-direction: column; gap: 15px;">
            <div>
                <label>Abstract Preview</label>
                <div class="abstract-box" id="panelAbstract"></div>
            </div>

            <div class="form-group">
                <label for="borrowerName">Your Name</label>
                <input type="text" id="borrowerName" placeholder="Enter your full name">
            </div>

            <div class="form-group">
                <label for="reserveDate">Choose Available Date (Mondays & Wednesdays)</label>
                <select id="reserveDate">
                    <!-- Populated automatically by JavaScript -->
                </select>
            </div>

            <button class="reserve-btn" onclick="makeReservation()">Confirm Instant Reservation</button>

            <div class="reservations-view">
                <label>Existing Bookings for this item:</label>
                <div id="existingReservations" style="margin-top: 5px;"></div>
            </div>
        </div>
    </aside>
</div>

<script>
    // EDIT YOUR THESIS CATALOG HERE
    const thesisDatabase = [
        { id: 1, year: "2025", title: "Exploring the Stories of Filipino Middle-Aged Single Mothers by Choice: A Narrative Analysis", author: "Bernardo, Marinold Therese; Casteñeda, Dyan Ross; Dela Cruz, Alyzza Nichole; Paccial, Derick Sean; Reyes, Rovenald reyes; Tulay, Marc Clarence", methodology: "Narrative", tags: ["Single mothers", "middle-aged women", "Filipino mothers", "singlehood", "motherhood"], abstract: "This study explores the lived experiences of Filipino middle-aged women, aged 46 to 59, residing in Metro Manila who have chosen single motherhood and remained single for at least five cinsecutive years. Utilizing a narrative research design and thematic analysis, the study investigates their personal journeys, including past relationships, motivations for remaining single, perceived benefits and challenges of single motherhood, and coping strategies. Semi-structured interviews with five participants were conducted to capture their relections on managing societal expectations, emotional struiggles, and the redifinition of family roles. Thematic analysis, based on Braun and Clarke's (2006) framework, revealed four central themes: Exhaustion, Priority, Freedom and Responsibility, and Growth. Exhaustion reflected the physical and emotional toll of managing multiple responsibilities alone. Priority highlighted the participants' focus on their children's well-being and their own peace of mind, supported by family acceptance. Freedom and Responsibility underscored the autonomy gained through singlehood, balanced with the burden of caregiving and household duties. Finalyy, Growth captured the personal development, resilience and empowerment the participantsbgained through their experiences. The findings contribute to a deeper understanding of single motherhood by choice in the Philippine context, offering insights into how these women challenge traditional notions of family and feminity while fostering strength, independence, and self-determination.", reservations: [] },
        { id: 2, year: "2025", title: "Fueling the Fire: A Narrative Study on the Motivational Attributions of Filipino Athletes in Tactical Sports", author: "Afable, Kyla Patrisha P.; Celocia, Mary Francine S.; Clemente, Angelie Dane O.; Dela Rosa, Matthew Albert T.; Felipe, Shawn Nicollei S.; Lanzona, Francine Dhierenae P.; Murillo, Kaila Marie / Tabal, Lezeethe G.", methodology: "Narrative", tags: ["Motivation", "motivational attributions", "tactical sports", "Filipino athletes", "judo", "fencing", "intrinsic motivation", "resilience", "athlete well-being"], abstract: "Motivation is the internal drive that directs and sustains an athlete's actions, helping them remain focused despite difficulties. Whether intrinsic or extrinsic, motivation plays a vital role in enabling athletes to maintain their passion and commitment to their sport. This study focuses on tactical sports, exploring how Filipino athletes sustain their \"fire\" through their motivational attributions, an area often overshadowed by more popular ball games. Using a narrative qualitative approach, seven national-level athletes were selected through purposive criterion sampling to provide rich experiential insights. In-depth interviews were transcribed, coded, and thematically analyzed from a constructivist standpoint to understand how athletes make meaning of their lived experiences, cultural influences, and challenges throughout their careers. Findings show that Filipino Judokas and Fencers sustain motivation through intrinsic passion, personal discipline, and resilience, reinforced by family, coaches, and cultural values. Motivation emerges as an evolving process shaped by personal drive and social support. These insights may guide coaches and sports institutions in developing programs that strengthen athlete motivation, well-being, and long-term participation in tactical sports.", reservations: [] },
        { id: 3, year: "2025", title: "Hinubog ng Kanlungan: A Narrative Study on the Lives of Aged-Out Orphans", author: "Laquindanum, Penelope Andrei R.; Luces, Therese Ann A.; Macapawa, Rica Mae A.; Osano, Francesca I.; Pambuena, Jim L.; Tanhueco, James Benedict", methodology: "Narrative", tags: ["Aged-out orphans", "Qualitative narrative approach", "Institutional Care", "Aging out"], abstract: "This study explored the lived experiences of aged-out orphans in the Philippines. It addressed the gap in understanding how aged-out orphans navigate life beyond institutional care, particularly in the absence of sustained familial and social support. Using a qualitative narrative approach, the study engaged a total of six participants utilizing a snowball and purposive sampling, having individuals aged 19 and above who have resided on an orphanage that served as their permanent shelter, have not been adopted or placed in a formal alternative care setting or any Social Welfare and Development Agencies (SWDAs), left the orphanage after reaching the age of majority, and are not currently under the care or custody of any alternative care provider. Data were collected through in-depth semi-structured interviews conducted over five sessions. Narrative analysis was employed to identify recurring patterns and themes to capture participants' lived experiences. Results showed various, rich stories from the participants from their journeys before, during and after aging out. The themes uncovered collectively illustrate the multidimensional challenges and adaptive strategies aged-cut orphans encounter as they transition from institutional care to independent adulthood. The themes found encompass struggles, adaptations, and integrating lessons from their respective experiences. As a whole, aged out orphans experience numerous interrelated challenges that span from before, during and after the aging out process. Among the findings, influences of the institution, struggles with necessities and stability after transitioning, social interactions and relationships, and purposeful living were identified to be significant in aged out orphans' lives.", reservations: [] },
        { id: 4, year: "2025", title: "Home Alone: Navigating the Empty Nest of Filipino Elderly", author: "Ang, Sara Jessica C.; Clarin, Euphemia M.; Damaso, MA. Sophia Liane S.; Damulog, Jamaeca Fresh G.; Dela Rosa, Angel Antonette R.; Longjas, Andrea Mae T.; Sakai, Masakiyo B.", methodology: "Narrative", tags: ["Elderly", "Empty Nest Elderly", "Empty Nest Period"], abstract: "The empty nest period among Filipinos is a recent phenomenon, as multigenerational living has traditionally been the norm because of Filipinos being known to be family-oriented, but due to evolving cultural values, socio-economic status, and work opportunities, adult children starts to move out from their parental home resulting with their elderly parents to live on their own (Royena, 2024; Bermudex-Hyun, 2023). This Qualitative Narrative study aimed to explore the life condition of the elderly as an empty nest through their narrative experiences and how these experiences affect their daily lives and family dynamics. Four (4) Filipino elderly parents were selected as participants, aged around sixty-seven to seventy-five (67-75) years old residing in Metro Manila, Philippines. This study used purposive sampling to qualify the participants through the use of Pre-Qualifying Form (PQF) consisting the criteria set by researchers. One-one-on in-depth unstructured interviews were conducted to gather data from the stories of the empty nest elderly. This study also utilized thematic narrative analysis in analyzing the data. The results highlighted the complexity of the emotional and practical transitions they experienced and still be able to support themselves and their children. Also, the shift from an active parental role to reduced engagement can bring feelings of loneliness and ambivalence, but opens up opportunities for self-discovery and adaptation. The findings showed that despite the problems, many participants had managed to redirect their energy to selfcare, doing new activities, and reflecting their resiliency in life.", reservations: [] },
        { id: 5, year: "2025", title: "Isang Kahig, Isang Tuwa: Exploring the Perceived Life Satisfaction of Filipino Individuals in a Family of Intergenerational Poverty", author: "Aquiatan, Chelsea Jean M.; Canlas, Gia Marie R.; Dela Cruz, Lyle Robbie V.; Osinsao, Andrea Nicole C.; Soriano, Elaine A. / Tabor, Lianne Marie M.", methodology: "Narrative", tags: ["Economic struggle", "intergenerational poverty", "perceived life satisfaction", "poverty", "living condition", "head of the family"], abstract: "The study pertains to \"Isang Kahig, Isang Tuwa: Exploring the Perceived Life Satisfaction of Filipino Individuals in a Family of Intergenerational Poverty. Filipinos are known to be resilient and happy people. Previous studies have established this even in families who experience financial and economic struggles. However, the persistence of poverty from family generations is still a concern. This qualitative study focused on exploring why poverty persists in the family despite perceived life satisfaction. Through a narrative approach, one-on-one in-depth interviews were conducted to Filipino individuals in the first, second, and third generations. The participants constituted of three (3) families that are under the poverty threshold for three (3) generations and were proven to be satisfied in life through the Satisfaction with Life Scale (SWLS). Through thematic analysis, the study revealed poverty struggles and poverty-driven attitudes as contributory factors to their current living condition. Self-gratifying beliefs such as perceived sufficient needs, spirituality, and instilled values are what constitute their perceived life satisfaction, While, upon reflecting about their living condition, they stated that simple happiness, acquired prosocial behavior, and future prospects are what matters to them. This showed that individuals in a family of intergenerational poverty focus on relationship, faith, and community more than economic growth. Because of the struggles they faced, they simply learned to be accepting and grateful. Still, younger generations showed hope and eagerness to change their current life. This study then suggests the importance of cultivating people, especially the younger generations, with knowledge and opportunities to break the cycle of poverty.", reservations: [] },
        { id: 6, year: "2025", title: "Paglisan sa Kinagisnan: Generation Z Blue-Collar Migrants' Journey Towards Independent Living in Metro Manila", author: "Aquinaldo, Adrienne Ericka C.; Aquino, Niña Bianca P.; Bugayong, Charlie B. Jr.; Fadera, Keziah Maru F.; Hadji Ali, Norhayna M.; Roguel, Patricia Charlene R.; Viola, Ana Selina; Zarate, Hannah Micaela P.", methodology: "Narrative", tags: ["Generation Z", "Gen Z", "blue-collar worker", "independent living", "internal migration", "autonomy", "filial obligation", "filial piety", "proactive resilience", "comfortable life", "inclusiveness", "qualitative narrative"], abstract: "Moving from the countryside to an urbanized city is expected by blue-collar workers who desire better living. But the advent of modern lifestyle, vanity, digitalization, and other postconventional 21st-century challenges, coupled with the Generation Z's idiosyncratic vulnerabilities such as low self-esteem and inferiority, makes a novel case for the \"Gen Z\" blue-collar worker whose journey towards independent living is unrepresented. Using a qualitative narrative approach, the researchers explored the lived experiences of \"Gen Z\" individuals who grew up in the countryside and are now working and living as blue-collar workers in Metro Manila. The study utilized a thematic analysis, and five main themes emerged, mapping out the journey of the \"Gen Z\" worker, from the undesirable predicament in the rural area and the motivators, to the challenges of independent living, the coping mechanisms and strategies, and, finally, the hopeful prospects and moral lessons. These themes have corresponding sub-themes that are either unique to Generation Z or like the mechanisms of previous generations. Practical considerations are discussed to promote their well-being and their inclusiveness in the workplace.", reservations: [] },
        { id: 7, year: "2025", title: "Para sa Pamilya: The Narrative of Single Female Middle-Aged Breadwinners", author: "Ayok, Jelaine F.; Carta, John Darren L.; De Guzman, Klark Emmanuel A.; Delos. Santos, Elaiza Kate A.", methodology: "Narrative", tags: ["Female Breadwinners", "Single", "Filipino Culture", "Family"], abstract: "In Filipino culture, the belief that \"family comes first\" is deeply ingrained, symbolizing both love and sacrifice. In many households where financial stability is fragile, one member often takes on the responsibility of providing for the family-frequently at the expense of personal dreams and aspirations. Over time, this responsibility grows heavier, influencing life choices and limiting the pursuit of personal independence. This study explored the journey of Filipino women who have chosen to remain single breadwinners and how they make meaning of their experiences. Using a qualitative narrative design, the researchers conducted five-session in-depth interviews with five single female participants aged 40 to 64. All interviews were audio-recorded, transcribed, and analyzed through the use of narrative thematic analysis. Data analysis revealed that participants experienced early exposure to financial hardship, loss of a family member, and were assigned household responsibilities while growing up. As breadwinners, they faced financial and medical challenges but demonstrated resilience through faith, family support, and self-reliance. Despite their struggles, they chose to remain single and fully dedicated to their families, finding purpose in fulfilling their role as providers. Their stories reflect the strength, endurance, and devotion that define the Filipino value of putting family above self.", reservations: [] },
        { id: 8, year: "2025", title: "A Paradigm Shift: Exploring the Role Reversal Experiences of Filipino Househusbands", author: "Macaraig, Nicole Ashlynne; Romero, Jessica C.; Suarez, Tryan Joshua T.; Agullana, Jahna Caryle; Torrefiel, Kyle Dominic P.; Macapagal, John Brendan A.; Aquino, Francis D.", methodology: "Phenomenological", tags: ["Filipino Househusbands", "Role Reversal", "Gender Roles", "Caregiving", "Masculinity"], abstract: "This qualitative phenomenological study explores the role reversal experiences of Filipino househusbands aged 30 to 60, residing in Metro Manila as they carry out the caregiving and domestic roles conventionally associated with their wives. In the context of an evolving society where more housewives enter the workforce or work abroad, an increasing number of Filipino men are taking on household duties, challenging deeply held gender norms and reshaping traditional definitions of masculinity. Through purposive sampling and in-depth interviews, the research reveals that Filipino househusbands face significant emotional stress, identity struggles, and social stigma, particularly during the early stages of role transition. The findings show that despite initial struggles with perceived loss of masculine identity and public judgment, many househusbands report developing pride in their caregiving roles. Over time, these Filipino men redefine their concepts of masculinity, integrating emotional availability, domestic competence, and partnership into their identities. To facilitate such a shift in family dynamics and encourage more equal standards of the society, the study recommends public awareness campaigns to normalize male caregiving and challenge traditional gender stereotypes, integrate gender-inclusive education to promote balanced understandings of masculinity and caregiving, establish community support programs for stay-at-home fathers to foster connection and shared experiences, strengthen policy that recognize and value unpaid domestic labor, ensuring equity in household roles for both men and women.", reservations: [] },
        { id: 9, year: "2025", title: "A Phenomenological Study on The Psychological Well-being of Persons Deprived of Liberty", author: "Casas, Czer Ambher D.; Erestain, Gio Rico E.; Franche, John Nicole M.; Muriel, Myls Benize M.; Penetrante, Rose Jade A.; Salameda, Jen Margie S.; Uy, Bryan Gunther T.; Vargas, Leandro Victor M.", methodology: "Phenomenological", tags: ["Coping Mechanism", "Jail Faculty", "Imprisonment/Confinement", "Persons Deprived of Liberty (PDL)", "Psychological Wellbeing"], abstract: "Confinement is more than a loss of freedom: it significantly impacts the psychological well-being of Persons Deprived of Liberty (PDL), which impacts their mental health in terms of acceptance, environment, personal growth, and social relationships. This qualitative research study will explore and understand the experiences, coping mechanism, realization, and insight of the PDL individuals who have been confined for at least two years in the Bureau of Jail Management and Penology (BJMP) at Antipolo City, Rizal. The researcher would uncover the struggles and challenges they experienced while inside the jail facility. This study was conducted using a qualitative exploratory method, and phenomenological approach. Using purposive sampling. a total of seven (7) PDLs participants were accumulated. The data gathered data were analyzed with the use of the Interpretative Phenomenological Analysis (IPA) in which six (6) main/central themes emerged: Correctional Conflicts, Perception of the Legal System, Existing Coping Strategies, Dynamics within the Correctional Facilities, Discernment of Self, Actualization of Redemption. This study concludes that while confinement poses significant psychological challenges in the well-being of the persons deprived of liberty, their experiences of resilience, personal growth, coping mechanisms, and support systems unravel the potential for recovery and redemption within the jail facility.", reservations: [] },   
        { id: 10, year: "2025", title: "Beyond Care (er): The Phenomenological Study of the Experiences of Psychiatric Nurses in Mentall Health Institution in the Philippines", author: "Del Carmen, Ofelia S.; Divina, Genyllynn N.; Manongsong, Shaira Mae V.; Muerong, Brythanie Shane G.; Paguio, Joyce Isabel N.", methodology: "Phenomenological", tags: ["Psychiatric Nurses", "Mental Health Nurses", "Psychiatric Nursing", "Challenges", "Reasons"], abstract: "While global research on psychiatric nurses’ challenges was extensive, there remained a notable gap in studies focusing on the Philippine context. Moreover, studies that examined the attitudes of Filipino psychiatric nurses towards patients with mental health issues remained limited and yielded inconclusive results. There remained a gap in understanding the reasons that made them persist in their roles despite these challenges. To fill these research gaps, the purpose of this study is to understand and describe the lived experiences of psychiatric nurses caring for mentally-ill patients and working in a mental health institution in the Philippines, specifically understanding and describing the challenges they faced, and the reasons they have that made them keep practicing psychiatric nursing. To gather data, interviews with six (6) psychiatric nurses were conducted. This data led to the following six (6) major themes: (1) The External and Internal Dimensions of Specialized Psychiatric Care, (2) Patient-Related Challenges, (3) System-Related Challenges, (4) From Trying to Thriving, (5) From Stigma to Understanding, and (6) The Moral Dimensions of Psychiatric Nurses. These themes would be helpful to enhance the quality of mental healthcare delivery and sustain the workforce.", reservations: [] },
        { id: 11, year: "2025", title: "Decoding Parenting: Lived Experiences of Mothers Raising Generation Alpha in a Digitally Connected World", author: "Aragon, Ervin Jeremy M.; Alonzo, Trikcy F.; Baterzal, Denny May B.; Mariano, Celine Rozel Z.; Rivera, Kassandra May O.; Santiago, Samantha V.", methodology: "Phenomenological", tags: ["Mother", "Parent", "parenting", "Generation Alpha", "technology", "digital", "digital world"], abstract: "This study explores the lived experiences of mothers raising Generation Alpha in a digitally connected world. It examined how mothers perceive the impact of technology on their children's development, identified the strategies they use to guide and support their children's digital engagement, and uncovered the significant turning points, lessons or realizations that have shaped their digital parenting practices. Using a qualitative phenomenological approach with purposive sampling, data were collected through semi structured interviews of five (5) mothers from Metro Manila. Data were analyzed through Braun and Clarke's (2006) thematic analysis, resulting in seven (7) major themes, positive and negative impacts of technology in the child's development, monitoring and rules, parenting strategies, struggles of parenting in online settings, online worries and concerns, and growth as a parent. Findings revealed that while technology supports learning and communication, excessive use of technology also poses risks to attention, health, and social interaction. The findings emphasized the need for mothers to balance and guide their children's digital engagement.", reservations: [] },
        { id: 12, year: "2025", title: "PROTEKTOR NG BAHAY AT BUHAY: LIVED EXPERIENCES OF MOTHER-POLICE OFFICERS", author: "Avilez, Kimberly; Cabitac, Frances Nadine M.; Ilao, Carl Benedict P.; Jorge, Julianne Angeline B.; Pasion, Keana Sophia E.; Repolito, Fiorela Jeica N.", methodology: "Phenomenological", tags: ["mother-police officers"], abstract: "This qualitative phenomenological study explored the lived experiences of Filipino Mother Police Officers as they manage the intersecting demands of motherhood and policing. Using a social constructivist worldview and Interpretative Phenomenological Analysis, the study examined how they understand their dual roles, what sustains them in service, and how institutional conditions shape their daily realities. Six Mother-Police Officers (MPOs) participated in in-depth interviews, and their narratives were analyzed through iterative coding and thematization.\n\nFindings showed that they practice motherhood through emotional guidance, academic support, sociocultural teaching, and maintaining closeness with their children despite irregular schedules. As police officers, they described themselves as flexible workers, protectors of public safety, and implementors of the law while facing risks, emotional strain, and unpredictable duties. Their motivation to remain in service was influenced by economic stability, social support, and a sense of purpose in serving both family and community. They also identified coping strategies and recognized the impact of institutional policies on their well-being.\n\nOverall, the study highlights the complex interplay between maternal responsibilities and the demands of police work and contributes to the limited local literature on mothers in law enforcement.", reservations: [] },
        { id: 13, year: "2025", title: "LEVEL OF BURNOUT AMONG GUIDANCE WORKERS: BASIS FOR PROPOSED SOCIAL SUPPORT MENTAL HEALTH PROGRAM", author: "Balabis, Edrianna Jeed M.; Cruz, Juanita Victoria L.", methodology: "Descriptive-Comparative", tags: ["burnout", "guidance workers", "social support", "mental health program", "Philippines"], abstract: "This paper used a descriptive-comparative research design to assess the prevalence of burnout among guidance workers in the Philippines to develop a targeted intervention. The purpose of the study was two-fold: first, to empirically determine the level of burnout experienced by this group using the Schaufeli Burnout Assessment Tool, and second, to investigate if the burnout levels varied significantly based on gender and years of service.\n\nUsing a sample of thirty guidance workers, the research utilized the BAT to measure four dimensions: Exhaustion, Mental Distance, Impaired Emotional Control, and Impaired Cognitive Control. The findings revealed a professional hazard: the overall sample was operating at a Severe Risk category for burnout. The study found the core dimensions of Exhaustion and Secondary Symptoms were rated as Severe Risk, while the other dimensions-Mental Distance, Emotional Impairment, and Cognitive Impairment were all rated as High Risk.\n\nThe study established a significant difference in vulnerability based on the examined demographics. The early-career group registered the highest level of overall burnout, demonstrating the most acute need across all four BAT dimensions. Similarly, the female cohort also exhibited a consistently high prevalence of burnout risk. These findings led to the formulation of a Proposed Social Support Mental Health Program, which is grounded in the Job Demands-Resources Model. It is tailored to address the vulnerabilities identified, focusing on injecting Job Resources and Personal Resources to mitigate the systemic and gender-specific emotional demands causing severe burnout, particularly among new and female guidance workers.", reservations: [] },
        { id: 14, year: "2025", title: "Caught in Conflict: A Mixed Methods Study on Ambivalence Among Experienced Filipino Voters", author: "Calisin, Kristiann Yvette V.; Jordan, Alexa Elise R.; Millonte, Kethleen Anne M.; Rodriguez, Jirah Mae L.; Vargas, Julianne J.", methodology: "Mixed Methods", tags: ["ambivalence", "Filipino voters", "electoral decision-making", "mixed methods"], abstract: "This study examined the nature of ambivalence among experienced Filipino voters through a sequential explanatory mixed-methods design grounded in the ABC Model of Ambivalence. The research explored how affective, behavioral, and cognitive dimensions of ambivalence shape electoral decision-making. In the quantitative phase, 103 Metro Manila voters who had participated in at least two elections answered the Adapted Trait Ambivalence Scale (A-TAS). Findings showed generally low-average ambivalence, with no significant differences across educational attainment or voting history, indicating that these demographic factors do not influence ambivalence.\n\nThe qualitative phase used Interpretative Phenomenological Analysis to examine the experiences of seven voters with high ambivalence. Eight themes revealed how ambivalence manifests in Filipino voters where they described factors, emotional tension and emotional resilience, deliberate voting and adaptive participation, and cognitive strain and coping, portraying ambivalence as a dynamic interplay of feeling, thought, and action. These insights highlight ambivalence as reflective skepticism and political maturity rather than apathy.\n\nIntegrating both phases showed that ambivalent voters critically assess candidates amid moral tension and informational uncertainty. Given the confusion caused by inconsistent or misleading information, the study recommends creating a centralized, credible digital platform presenting standardized candidate information. Future research should refine the A-TAS and include voters from diverse regions and experience levels to strengthen the scale's applicability and broaden understanding of ambivalence in the Philippine electorate.", reservations: [] },
        { id: 1, year: "2024", title: "Breaking Barriers: Understanding the Lived Experiences of Heterosexual Children with Gay Fathers", author: "Alonso, Carlos Gabriel P.; Bustamante, Franz Albert A.; Cases, MA. Alexandra Jade E.; Eleazar, Angelo Christian Q.; Lopriego, Erika Mae L.; Pecina, Goethe Karl F.; Peralta, Dinky T.; Reyes, Honey Kyle C.; Trinidad, Tanya larisse L.", methodology: "Phenomenological", tags: ["Gay fathers", "familial relationships", "phenomenological approach", "Metro Manila", "Thematic Analysis", "heterosexual children raised by biological gay fathers", "societal norms"], abstract: "Familial relationships in the Philippines are deeply influenced by strong cultural values, yet the growing recognition of diverse family structures, including those led by gay fathers, highlights the need for deeper understanding. Despite being one of the most LGBTQ-friendly countries in Asia, the Philippines still faces challenges regarding the acceptance of non-traditional family forms. This current study also aims to fill the gap in research on children raised by gay fathers whose existing studies have primarily focused on children of lesbian mothers, neglecting the experiences of children with gay fathers and the unique challenges these families face, including the support to address stigma and trauma. Additionally, this current study aims to produce its own Eastern-based findings providing insights into how cultural contexts, such as Filipino family values and societal norms, influence the experiences of children in non-traditional family structures. To bridge these gaps and achieve its objectivity, this present study utilized a phenomenological approach to explore, unveil and delve deeper into the uncovered lived experiences of heterosexual children raised by their biological gay fathers. Four (4) participants, aged fifteen (15) to twenty-seven (27) years old, from Metro Manila, who were raised by and lived with their biological gay fathers throughout their childhood and adolescence, underwent semi-structured interviews. As the primary research instrument, the participants were interviewed using a validated aide-memoire. After thoroughly analyzing the participants' responses using Thematic Analysis, the study had conceptualized five (5) themes: (1) Child and Parent Familial Bond (2) Communication between Child and Gay Father, (3) Acceptance vs Societal Stigma and Negative Experiences, (4) Defying Stereotypes and Prejudices and (5) Emotional Responses and Perceptions. By exploring and amplifying the lived experiences of heterosexual children with gay fathers, the findings contribute in reducing prejudices and societal stigma and promoting inclusivity for non-traditional families.", reservations: [] },
        { id: 2, year: "2024", title: "Listening to the Unheard: Exploring the Lived Experience of Hard-of-Hearing (HoH) Middle to Late Adolescents in the SpEd Program", author: "Bosogon, Hailey Milicent C.; Lorca, Aliree Mae P.; Rodriguez, Desirine Carrie Anne; Tlean, Erica Anne P.; Tuzon, Polo Maher-Salal Hash-Baz F.", methodology: "Phenomenological", tags: ["Hard-of-Hearing", "HoH adolescents", "SpEd Program", "lived experience", "coping mechanisms"], abstract: "This research explored the lived experiences of Hard-of-Hearing (HoH) middle to late adolescents in Special Education (SpEd) programs, focusing on their own subjective reality. The researchers employed a phenomenological approach, one-on-one semi-structured interviews that were conducted with HoH students to uncover insights into their challenges and coping mechanisms. Data analysis using Interpretative Phenomenological Analysis (IPA) identified 11 key themes, organized into four master themes: Navigating Social Relationship, Educational and Social Struggles in the Learning Institutions, Adaptation Mechanisms, and Supportive Networks for Well-being and Self-Empowerment. The findings revealed that HoH students faced significant challenges, including communication barriers, peer exclusion, and limited classroom accommodations, which hindered their integration and learning experiences. Despite these struggles, participants demonstrated resilience through strategies such as creative expression, athletic engagement, and interaction techniques. Emotional support from family, peers, and educators emerged as a vital factor in fostering self-confidence and emotional well-being. The study concluded that acceptance and belongingness within SpEd programs, plays a crucial role in development of HoH students. By understanding their lived experiences, the research emphasized the importance of psychosocial support enhancement to enhance their academic, social, and emotional outcomes within the SpEd program.", reservations: [] },
        { id: 3, year: "2024", title: "Marital Infidelity: A Phenomenological Study on Self-healing Among Betrayed Wives", author: "Arienda, Rizza May; Bautista, River Jude Chaelen P.; Delgado, Jan Lloyd Joshua P.; Lozari, Nikki P.", methodology: "Phenomenological", tags: ["Acceptance", "emotional pain", "forgiveness", "marital infidelity", "self-healing", "resentment"], abstract: "This phenomenological study investigated the lived experiences of wives who attained self-healing despite the marital infidelity of their husband. Their process of self-healing perceived understanding of four (4) wives, ages from thirty-two (32) to fifty-four (54), were explored in a semi-structured interview of forty (40) to sixty (60) minutes per session, guided with the researchers' validated aide memoire. The collected data from the participants were transcribed, coded, and analyzed using Interpretative Phenomenological Analysis (IPA). The researchers generated eight (8) superordinate themes: Unveiling of Betrayal, Psychological Impact, Motherhood over being a Wife, Forgiveness and Rebuilding Relationship, Enhanced Support System, Pathways to Emotional Recovery, Embracing Growth, and Empowered Self. The results highlight the process of self-healing that wives undergo after experiencing marital infidelity, even while continuing to live with their husbands. This study offers valuable insights and brings hope to women facing similar struggles. It aims to raise awareness about the emotional journey of recovery and the resilience involved, providing support for those navigating the complex challenges of infidelity within their marriage.", reservations: [] },
        { id: 4, year: "2024", title: "Shadowed Sunset: Lived Experience of Desolated Elderly Filipino Women Residing in a Nursing Home", author: "Villanueva, Julianna Jelena P.; Ojero, Mikaella E.; Dalisay, Mark Andy R.; Pangilinan, Trish Lovill P.; Señoron, Alexander James R.", methodology: "Phenomenological", tags: ["Elderly Filipino women", "Desolated", "Eldercare facilities", "Nursing homes", "Filipino values", "Lived experiences"], abstract: "‘Elderly Abandonment’ is a crucial yet under-researched phenomenon in Filipino society, often overshadowed by the nation’s strong family-oriented values. This phenomenological study explores the experiences of desolated elderly Filipino women residing in eldercare facilities. Semi-structured interviews were used to gather data from nine women aged 60 and above who have been living in Abuelos Haven Nursing Home and Tahanang Balik Alay for at least one year without regular family visits. Thematic analysis was used to derive the themes: Resident-Centered Evaluations, Feelings of Ambivalence, Personal and Relational Roadblocks, and Acculturation to a New Environment. These themes represent the women's challenges with abandonment, adaptation efforts, and the pursuit of belonging and well-being in the facility. This study points to the need for improved eldercare policies and greater social awareness of the special issues associated with abandoned elderly women. Future research should expand their scope to include other contexts while probing deeper into their experiences.", reservations: [] },
        { id: 5, year: "2024", title: "Through the Lens of Time: The Quality of Life of Filipino Adults with Diabetic Retinopathy", author: "Alejo, Rausanna Florence Y.; Amante, Shekinah C.; Ancheta, Mark Adriane; Chua, Khayla Gail D.; De Guzman, Ryle Adrian R.; Dy, Febie Dianne F.; Savellano, Rojan P.; Uriarte, John Cervie P.", methodology: "Phenomenological", tags: ["Type 2 Diabetes", "Diabetic Retinopathy", "Quality of Life", "support", "Exploratory"], abstract: "‘Diabetic Retinopathy’ is a diagnosis often overlooked by the Filipino citizens because of factors such as Financial and Culture. As being set aside, this exploratory study explored the Quality of Life of Filipino Adults with Diabetic Retinopathy. The study is conducted through the use of semi - structured interviews to gather data from 5 Filipino adults ages 35 - 60 years old who have been diagnosed with Type 2 Diabetes for at least three (3) years and with Diabetic (1) year. Usage of thematic analysis to generate themes. The formulated themes are as follows: The 3 themes navigating setbacks, managing personal dilemmas, and support mechanisms. Each theme shows the perception of Filipino Adults with Diabetic Retinopathy. With the help of the results of the present paper, the researchers recommend broadening the scope of the study and deepening the investigation of the experiences of the participants", reservations: [] },
        { id: 6, year: "2024", title: "Ties Unbound: A Phenomenological Study on the Lived Experiences of Young Adult Females with Paternal Abandonment", author: "Dabu, Elisha Raziella Gabrielle; Domingo, Ashlee Nicole I.; Lintac, Princess Shane O.; Manuel, Christine Joy B.; Rafael, Joemari-Heart M.; Sanchez, Annika B.", methodology: "Phenomenological", tags: ["Paternal abandonment", "young adult females", "mental health program", "mental health", "relationships"], abstract: "Paternal abandonment is a significant yet often overlooked issue that profoundly affects the psychological and emotional well-being of abandoned children, particularly young adult females. According to the Population Institute of the University of the Philippines (2022), 18% more Filipino youth grow up with only their mothers than those raised solely by their fathers (4.2%). This qualitative phenomenological study explores the lived experiences of young adult females abandoned by their fathers at a young age and addresses gaps in literature and support systems by proposing a tailored mental health program. One-on-one semi-structured interviews were conducted with two participants from different institutions in Metro Manila, Philippines. Thematic analysis identified four major themes: (1) Father-Daughter Disconnect, (2 Experiencing Abuse, (3) Interpersonal Relationship Issues, and (4) Romantic Relationship Problems, with fifteen sub-themes providing deeper insights. The study highlights the long-term effects of paternal abandonment, including mental health struggles and difficulties in forming relationships. Recommended interventions include cognitive restructuring, somatic therapy, assertiveness training, and the empty chair technique to foster healing and resilience. Given the study's limited sample size, future researchers are encouraged to expand participant scope by collaborating with more support institutions and broadening selection criteria to capture diverse experiences and minimize limitations.", reservations: [] },
        { id: 7, year: "2024", title: "A Case Study: Social Ableist Experiences of a 29 Year Old Filipino with Dyslexia", author: "Cavitt, Daniella Faye M.; Dulog, Denuelle Jewel A.; Logmao, Yanela Cassandra P.; Rumbawa, Shekinah Bless B.", methodology: "Case Study", tags: ["Dyslexic Filipino", "Social Ableism", "Self-Concept", "Coping Mechanism", "Discrimination", "Special Learning Disability", "Qualitative Case Study"], abstract: "This qualitative study explores the social ableist experiences of a 29-year-old Filipino with dyslexia, focusing on the challenges he faced in terms of social inclusion, coping mechanisms, and the impact of social ableism. Dyslexia, a neurological condition under the umbrella of special learning disabilities, affects individuals' ability to process written and spoken language, often leading to discrimination and exclusion in key areas such as healthcare, work, and education. Through purposive sampling, the study gathered qualitative data from a Filipino adult residing in Bicol who have dyslexia. Seven (7) sessions using a semi-structured interview were conducted with the participant, focusing on personal experiences, coping strategies, and the impact of societal prejudices. Findings reveal that familial support plays a crucial role in the emotional and developmental well-being of a person with dyslexia, yet feelings of inferiority and societal judgment persist. The participant demonstrated a range of adaptive coping mechanisms, drawing on familial and personal strategies to manage daily challenges. The research reveals the prominent impact of social ableism, especially in educational and professional settings, where it negatively affects the self-perception and self-esteem of people with dyslexia. Despite these challenges, resilience from self-reassurance emerged as key factors in fostering optimism and self-acceptance. However, the study is limited to only one specific case from a 29-year-old male Filipino, which may not fully capture the diversity of experiences among Filipino adults with dyslexia Additionally, the broad geographic scope of participant recruitment across Luzon introduces variability in environmental factors, potentially affecting the consistency and generalizability of the findings. The study highlights the need for tailored support systems, increased social awareness and strategies to promote social inclusion for people with dyslexia.", reservations: [] },
        { id: 8, year: "2024", title: "Navigating Emotional Storms: Case Study on the Journey to Social Reintegration of a Former Juvenile with Emotional Dysregulation", author: "Escaro, Arlynne Grace S.; Galarretta, Ian J.L. F.; Rivera, Nikolas Riki K.; Saavedra, Brigette Francine A.; Songodanan, Sheena Mae M.; Velasquez, Stephanie Therese C.", methodology: "Case Study", tags: ["Juvenile Delinquency", "Emotional Dysregulation", "Former Juvenile Delinquent", "reintegration", "case study", "thematic analysis", "Cavite", "rehabilitation program"], abstract: "Juvenile Delinquency remains a pressing social concern, often rooted in complex psychological and emotional challenges. Among these, emotional dysregulation—a pattern of difficulty in managing intense emotions has been identified as a significant factor influencing delinquent behaviors. The present case study aims to understand further the social reintegration experience of a former juvenile delinquent with Emotional Dysregulation. The study used one-on-one semi-structured interviews conducted through online platforms with a participant from Cavite City, Philippines. Through the use of thematic analysis, the following (13) themes emerged: Experiencing Toxic Childhood, Recognizing Emotions, Expressing Dysregulation, Expressing Defiance and Rebellion, Succumb to Peer Influence, Evaluating Program Effectiveness, Expressing Frustrations, Reflecting on Behavioral Records and Outcomes, Relying on the Family as a Backbone, Striving for Education and Work Success, Utilization of Coping Strategies, Turning Points to a Better Life. and Reducing Recidivism. Given the study's limitations, further research is recommended to deepen the understanding of emotional dysregulation among juvenile delinquents and explore the potential of a new rehabilitation program that would enable a successful reintegration.", reservations: [] },
        { id: 9, year: "2024", title: "The Interpersonal Trauma Recovery of a Quadragenarian Male Survivor of Sexual Abuse: A Case Study", author: "Balino, Michael Dale M.; Darnayla, Joe Mari Denzen E.; Fernandez, Jan Clarisse M.; Galvez, Jackie Lynn T.; Hedia, Johnalyn Clariss B.; Magcalas, Ray Angeline A.", methodology: "Case Study", tags: ["Interpersonal trauma recovery", "quadragenarian male", "sexual abuse survivor", "trauma recovery"], abstract: "-", reservations: [] },

        
        
    ];

    let currentYear = "2025";
    let currentCategory = "All";
    let selectedBookId = null;

    // Initialization
    function init() {
        renderTabs();
        renderFilters();
        renderCatalog();
        populateAvailableDates(8); // Generates upcoming Mondays & Wednesdays for 8 weeks ahead
    }

    // Dynamic Monday and Wednesday Date Generator
    function populateAvailableDates(weeksAhead = 8) {
        const select = document.getElementById('reserveDate');
        select.innerHTML = '';
        
        const today = new Date();
        let count = 0;
        
        for (let i = 0; count < weeksAhead * 2; i++) {
            const d = new Date();
            d.setDate(today.getDate() + i);
            
            const dayOfWeek = d.getDay(); // 1 = Monday, 3 = Wednesday
            
            if (dayOfWeek === 1 || dayOfWeek === 3) {
                const isoDate = d.toISOString().split('T')[0];
                const formattedText = d.toLocaleDateString('en-US', {
                    weekday: 'long',
                    month: 'short',
                    day: 'numeric',
                    year: 'numeric'
                }).replace(',', ' -');

                const option = document.createElement('option');
                option.value = isoDate;
                option.textContent = formattedText;
                select.appendChild(option);
                
                count++;
            }
        }
    }

    function renderTabs() {
        const years = [...new Set(thesisDatabase.map(b => b.year))].sort().reverse();
        const container = document.getElementById('yearTabs');
        container.innerHTML = years.map(y => `
            <button class="tab-btn ${y === currentYear ? 'active' : ''}" onclick="setYear('${y}')">${y}</button>
        `).join('');
    }

    function renderFilters() {
        const categories = ["All", ...new Set(thesisDatabase.map(b => b.methodology))];
        const container = document.getElementById('catFilters');
        container.innerHTML = categories.map(c => `
            <button class="cat-btn ${c === currentCategory ? 'active' : ''}" onclick="setCategory('${c}')">${c}</button>
        `).join('');
    }

    function renderCatalog() {
        const query = document.getElementById('searchBar').value.toLowerCase();
        const container = document.getElementById('catalogList');
        
        const filtered = thesisDatabase.filter(book => {
            const matchesYear = book.year === currentYear;
            const matchesCat = currentCategory === "All" || book.methodology === currentCategory;
            const matchesSearch = book.title.toLowerCase().includes(query) || 
                                  book.abstract.toLowerCase().includes(query) ||
                                  book.tags.some(t => t.toLowerCase().includes(query));
            return matchesYear && matchesCat && matchesSearch;
        });

        if(filtered.length === 0) {
            container.innerHTML = '<p style="color: var(--text-muted); padding: 10px;">No matching theses found.</p>';
            return;
        }

        container.innerHTML = filtered.map(book => `
            <div class="book-card ${book.id === selectedBookId ? 'selected' : ''}" onclick="selectBook(${book.id})">
                <div class="book-title">${book.title}</div>
                <div class="book-meta">
                    <span>👤 ${book.author}</span>
                    <span>📂 ${book.methodology}</span>
                    <span>📅 ${book.year}</span>
                </div>
                <div style="display:flex; gap:5px; flex-wrap:wrap;">
                    ${book.tags.map(t => `<span class="tag">#${t}</span>`).join('')}
                </div>
            </div>
        `).join('');
    }

    function setYear(year) {
        currentYear = year;
        renderTabs();
        renderCatalog();
    }

    function setCategory(cat) {
        currentCategory = cat;
        renderFilters();
        renderCatalog();
    }

    function selectBook(id) {
        selectedBookId = id;
        renderCatalog();
        
        const book = thesisDatabase.find(b => b.id === id);
        document.getElementById('panelTitle').innerText = book.title;
        document.getElementById('panelAbstract').innerText = book.abstract;
        document.getElementById('panelContent').style.display = 'flex';
        
        updateReservationsList(book);
    }

    function updateReservationsList(book) {
        const container = document.getElementById('existingReservations');
        if(book.reservations.length === 0) {
            container.innerHTML = '<p style="color: var(--text-muted)">No active reservations. All dates open.</p>';
            return;
        }
        container.innerHTML = book.reservations.map(r => `
            <div class="res-item">
                <span class="res-date">🗓️ ${r.date}</span>
                <span>Claimed by: ${r.name}</span>
            </div>
        `).join('');
    }

    function makeReservation() {
        const name = document.getElementById('borrowerName').value.trim();
        const date = document.getElementById('reserveDate').value;
        
        if(!name) {
            alert('Please enter your name to book!');
            return;
        }

        const book = thesisDatabase.find(b => b.id === selectedBookId);
        
        const exists = book.reservations.some(r => r.date === date);
        if(exists) {
            alert('This specific book is already reserved for that date! Please select another open Monday or Wednesday.');
            return;
        }

        book.reservations.push({ date, name });
        alert(`Successfully reserved "${book.title}" for ${date}!`);
        document.getElementById('borrowerName').value = '';
        updateReservationsList(book);
    }

    document.getElementById('searchBar').addEventListener('input', renderCatalog);
    init();
</script>
</body>
</html>
